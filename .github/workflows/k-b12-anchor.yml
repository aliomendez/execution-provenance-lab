# Public digest commitment only; no claim of local execution or custody.
name: DT K B12 digest anchor
on:
  workflow_dispatch:
    inputs:
      sha256:
        description: SHA-256 of canonical stage packet (no private data)
        required: true
        type: string
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  anchor:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Validate digest
        env:
          STAGE_DIGEST: ${{ inputs.sha256 }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"[0-9a-f]{64}",os.environ["STAGE_DIGEST"])'
      - name: Attest digest only
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: DT-K-B12-PACKET
          subject-digest: sha256:${{ inputs.sha256 }}
          push-to-registry: false
          create-storage-record: false
      - name: Export public proof reference
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          printf 'Attestation: %s\n' "$ATTESTATION_URL"
          printf 'PUBLIC_BUNDLE_BASE64='
          base64 -w0 "$BUNDLE_PATH"
          printf '\n'
